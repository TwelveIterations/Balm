modLoader="javafml"
loaderVersion="*"
license="${license}"
issueTrackerURL="https://github.com/TwelveIterations/Balm/issues"
[[mods]]
modId="balm"
version="${version}"
displayName="${mod_name}"
displayURL="https://balm.twelveiterations.com/"
logoFile="balm.png"
credits="BlayTheNinth"
authors="BlayTheNinth"
description='''${description}'''
[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.api.mixins.json"
[[mixins]]
config = "${mod_id}.forge.mixins.json"
[[dependencies.balm]]
    modId="forge"
    mandatory=true
    versionRange="[${forge_version},)"
    ordering="NONE"
    side="BOTH"
[[dependencies.balm]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
