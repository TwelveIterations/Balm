plugins {
    alias libs.plugins.fabricLoom
}

dependencies {
    minecraft libs.minecraft
    implementation libs.fabricLoader
    implementation libs.fabricApi
}

apply from: rootProject.file('repositories.gradle')
apply from: 'dependencies.gradle'

processResources {
    dependsOn(configurations.commonExampleResources)
    dependsOn(configurations.commonExampleGeneratedResources)
    from(configurations.commonExampleResources)
    from(configurations.commonExampleGeneratedResources)
}

loom {
    def aw = project(":common").file("src/main/resources/${mod_id}.classtweaker")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    runs {
        client {
            client()
            setConfigName("fabric Example")
            ideConfigGenerated(true)
            runDir("runs/client")
        }
    }
}
