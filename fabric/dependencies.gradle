repositories {
    maven {
        url "https://maven.siphalor.de/"
        content {
            includeGroup "de.siphalor"
        }
    }
}

dependencies {
    include modApi("net.blay09.mods:kuma-api-fabric:$kuma_version")

    modCompileOnly "mezz.jei:jei-$jei_minecraft_version-fabric-api:$jei_version"
    if (jei_minecraft_version == minecraft_version) {
        modRuntimeOnly "mezz.jei:jei-$jei_minecraft_version-fabric:$jei_version"
    }

    modCompileOnly "com.terraformersmc:modmenu:$modmenu_version"
    // modLocalRuntime "com.terraformersmc:modmenu:$modmenu_version"

    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:11.0.99"

    modCompileOnly 'teamreborn:energy:4.0.1'

    modCompileOnly "curse.maven:configured-457570:6023970"
    // runtimeOnly 'com.electronwill.night-config:core:3.8.1'
    // runtimeOnly 'com.electronwill.night-config:toml:3.8.1'

    modCompileOnly "dev.emi:trinkets:3.10.0"
    modCompileOnly "mcp.mobius.waila:wthit:fabric-$wthit_version"
    modCompileOnly "curse.maven:jade-324717:$jade_fabric_version"
    //modImplementation "curse.maven:jade-324717:$jade_fabric_version"

    modCompileOnly "dev.emi:trinkets:3.7.2"

    modCompileOnly 'me.lucko:fabric-permissions-api:0.3.3'
}